# Add this block to ~/.codex/config.toml
# ChatGPT desktop, Codex CLI, and the Codex IDE extension share this config.

[mcp_servers.bloomberg]
command = "bloomberg-mcp"
args = []
cwd = "/ABSOLUTE/PATH/TO/bloomberg-mcp-tj"
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.bloomberg.env]
BLOOMBERG_HOST = "127.0.0.1"
BLOOMBERG_PORT = "8194"
